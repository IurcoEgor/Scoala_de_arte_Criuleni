name: Inject Secrets and Deploy
on:
  push:
    branches: [ main ] # или master, смотря какая у тебя ветка

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject Secrets into JS file
        run: |
          sed -i "s|REPLACE_FIREBASE_API_KEY|${{ secrets.FIREBASE_API_KEY }}|g" firebase-config.js
          sed -i "s|REPLACE_FIREBASE_AUTH_DOMAIN|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" firebase-config.js
          sed -i "s|REPLACE_FIREBASE_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|g" firebase-config.js
          sed -i "s|REPLACE_FIREBASE_STORAGE_BUCKET|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" firebase-config.js
          sed -i "s|REPLACE_FIREBASE_MESSAGING_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" firebase-config.js
          sed -i "s|REPLACE_FIREBASE_APP_ID|${{ secrets.FIREBASE_APP_ID }}|g" firebase-config.js
          sed -i "s|REPLACE_FIREBASE_MEASUREMENT_ID|${{ secrets.FIREBASE_MEASUREMENT_ID }}|g" firebase-config.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . # Копирует все файлы проекта в ветку gh-pages
          branch: gh-pages
